<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/codecirclelogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Code Circle — The elite student developer portal for events, assessments, and community." />
    <link rel="preconnect" href="http://localhost:5000" />
    <link rel="dns-prefetch" href="http://localhost:5000" />
    <title>Code Circle</title>
    <script>
      (function() {
        try {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
          localStorage.setItem('code-circle-theme', 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root" data-vaul-drawer-wrapper=""></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
